# Kotlin compilation for the Android plugins exceeds the default 512 MB
# metaspace cap. Limit parallel workers so the 1 GB cap remains stable on
# development machines with 16 GB RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Android Gradle Plugin 8.9 / Kotlin 2.1 do not support Java 26 yet.
org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
android.useAndroidX=true
android.enableJetifier=true
# Avoid Kotlin incremental cache errors when project (F:) and pub cache (C:) are on different drives
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
